# Information Plugin Configuration
# A paper plugin to show player's information

settings:
  # Allow to execute command /playerinfo and show self statistics
  permission-self: "information.self"

  # Allow admins to execute command /playerinfo on all players, online and offline
  permission-others: "information.playerinfo"

  # Allow to execute the command /information reload
  admin-permission: "information.admin"

  # Fields hidden when a player runs /playerinfo on themselves with ONLY information.self
  # (Players with information.playerinfo or OP still see everything)
  # Available keys: status, last-seen, uuid, ip, op-status, banned-status, first-join,
  # playtime, world, dimension, position, last-death, spawn-location, health, food,
  # xp-level, ping, gamemode, mob-kills, deaths, pvp-wins, pvp-losses, effects
  self-hidden-fields:
    - "status"
    - "ip"
    - "op-status"
    - "banned-status"
    - "world"
    - "last-death"
    - "spawn-location"

messages:
  no-permission: "&cYou do not have permission to execute this command!"
  no-permission-other: "&cYou do not have permission to view other players' profiles!"
  usage: "&eCorrect usage: /playerinfo [player_name]"
  player-not-found: "&cThe player {player} has no recorded data on this server."
  reload-success: "&aInformation plugin configuration reloaded successfully!"
  reload-usage: "&eCorrect usage: /information reload"

  info:
    header: "&a--- Information about {player} ---"
    status: "&fStatus: {status}"
    status-online: "&aONLINE"
    status-offline: "&cOFFLINE"
    last-seen: "&fLast Seen: &e{date}"
    uuid: "&fUUID: &7{uuid}"
    ip: "&fIP Address: &4{ip}"
    op-status: "&fOP Status: &e{op}"
    banned-status: "&fBanned: &c{banned}"
    first-join: "&fFirst Join: &e{date}"
    playtime: "&fTotal Playtime: &a{playtime}"
    world: "&fWorld: &e{world}"
    dimension: "&fDimension: &b{dimension}"
    position: "&fPosition: X={x} Y={y} Z={z}"
    last-death: "&fLast Death: &c{death}"
    spawn-location: "&fSpawn Location: &e{spawn}"
    health: "&fHealth: &c{health}/20"
    food: "&fFood: &6{food}/20"
    xp-level: "&fXP Level: &b{level}"
    ping: "&fPing: &d{ping} ms"
    gamemode: "&fGameMode: &9{gamemode}"
    mob-kills: "&fMob Kills: &a{mob_kills}"
    deaths: "&fTotal Deaths: &c{deaths}"
    pvp-wins: "&fPvP Wins: &e{pvp_wins}"
    pvp-losses: "&fPvP Losses: &4{pvp_losses}"
    effects: "&fActive Effects: &d{effects}"

# Available placeholders:
#
# %information_status%     ONLINE/OFFLINE status
# %information_uuid%       UUID of player
# %information_ip%         Last IP of player
# %information_op%         Is player OP?
# %information_banned%     Ban status
# %information_first_join% First join date
# %information_last_seen%  Last seen date/time
# %information_playtime%   Total server playtime
# %information_world%      Name of the world
# %information_dimension%  Dimension
# %information_x%          X
# %information_y%          Y
# %information_z%          Z
# %information_last_death% Last death point
# %information_spawn%      Spawn/bed position
# %information_health%     Health
# %information_food%       Hunger
# %information_level%      XP level
# %information_ping%       Latency ms
# %information_gamemode%   Last/actual gamemode
# %information_mob_kills%  Total mob kills
# %information_deaths%     Total deaths
# %information_pvp_wins%   PVP wins against player
# %information_pvp_losses% PVP losses against player
# %information_effects%    Potion effects